spring.application.name=subsistemaSeguridad
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# Configuración Base de Datos H2 En Memoria
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:seguridad_db;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

security.jwt.secret=${JWT_SECRET:a8f7c2d9e1b4a6c3f9d0e7a2c5a1f8e8e6c9b3a7e0f2c8d1a2b1e6f3c7d4a2b8}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Subsistema Seguridad PALA}
app.security.verification.expiration-minutes=${VERIFICATION_CODE_EXPIRATION_MINUTES:15}
app.security.verification.max-attempts=${VERIFICATION_CODE_MAX_ATTEMPTS:5}

# Habilitar Consola Web de H2 (Ruta: /h2-console)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
server.error.include-message=always
server.error.include-stacktrace=always
